<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backrooms Level 推理ゲーム</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

    background: #151515;
    color: #e8e8e8;

    display: flex;
    justify-content: center;

    padding: 30px 15px;
}

.game-container {
    width: 100%;
    max-width: 850px;
}

h1 {
    text-align: center;
    letter-spacing: 5px;
    font-size: 2.5rem;
    margin-bottom: 30px;
}

h2 {
    font-size: 1.1rem;
    margin-top: 0;
}


/* 上部情報 */

.info-bar {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.info-bar div {
    flex: 1;

    background: #222;
    border: 1px solid #444;

    padding: 15px;

    text-align: center;
}

.info-bar span {
    display: block;

    margin-top: 5px;

    font-size: 1.8rem;
    font-weight: bold;
}


/* 質問履歴 */

.history-section {
    background: #202020;

    border: 1px solid #3c3c3c;

    padding: 20px;

    margin-bottom: 20px;

    min-height: 100px;
}

.history-item {
    padding: 10px;

    border-bottom: 1px solid #444;
}

.history-item:last-child {
    border-bottom: none;
}

.answer-yes,
.answer-no {
    font-weight: bold;
}

.empty-history {
    color: #888;
}


/* 質問 */

.question-section {
    background: #202020;

    border: 1px solid #3c3c3c;

    padding: 20px;
}

.question-buttons {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 12px;
}

.question-button {
    min-height: 90px;

    padding: 15px;

    border: 1px solid #555;

    background: #292929;
    color: white;

    font-size: 1rem;

    cursor: pointer;

    transition: 0.15s;
}

.question-button:hover {
    background: #353535;
    border-color: #888;
}

.question-button:active {
    transform: scale(0.98);
}


/* 回答ボタン */

.answer-section {
    margin-top: 20px;

    text-align: center;
}

.guess-button {
    width: 100%;

    padding: 18px;

    border: 1px solid #777;

    background: #303030;
    color: white;

    font-size: 1.1rem;

    cursor: pointer;
}

.guess-button:hover {
    background: #404040;
}


/* Level選択 */

.guess-panel {
    margin-top: 20px;

    background: #202020;

    border: 1px solid #555;

    padding: 20px;
}

.level-buttons {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;
}

.level-button {
    padding: 15px;

    background: #292929;
    color: white;

    border: 1px solid #555;

    cursor: pointer;
}

.level-button:hover {
    background: #3a3a3a;
}

.cancel-button {
    width: 100%;

    margin-top: 15px;

    padding: 12px;

    background: #222;
    color: #aaa;

    border: 1px solid #444;

    cursor: pointer;
}


/* 結果 */

.result {
    margin-top: 20px;

    text-align: center;

    background: #202020;

    border: 1px solid #777;

    padding: 30px;
}

.result h2 {
    font-size: 2rem;
}

.result button {
    margin-top: 15px;

    padding: 15px 30px;

    background: #303030;
    color: white;

    border: 1px solid #666;

    cursor: pointer;
}


/* 非表示 */

.hidden {
    display: none;
}


/* スマホ */

@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    h1 {
        font-size: 1.8rem;
        letter-spacing: 3px;
    }

    .question-buttons {
        grid-template-columns: 1fr;
    }

    .level-buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .info-bar {
        gap: 8px;
    }
}
</style>
</head>


<body>

<main class="game-container">

    <h1>BACKROOMS<br>LEVEL GUESSER</h1>

    <div class="info-bar">
        <div>
            質問数
            <span id="question-count">0</span>
        </div>

        <div>
            残り候補
            <span id="remaining-count">12</span>
        </div>
    </div>


    <section class="history-section">
        <h2>質問履歴</h2>

        <div id="history">
            <p class="empty-history">
                まだ質問していません。
            </p>
        </div>
    </section>


    <section class="question-section">

        <h2>質問を選んでください</h2>

        <div id="question-buttons" class="question-buttons"></div>

    </section>


    <section class="answer-section">

        <button id="guess-button" class="guess-button">
            答えを決める
        </button>

    </section>


    <section id="guess-panel" class="guess-panel hidden">

        <h2>答えを選んでください</h2>

        <div id="level-buttons" class="level-buttons"></div>

        <button id="cancel-button" class="cancel-button">
            戻る
        </button>

    </section>


    <section id="result" class="result hidden">

        <h2 id="result-title"></h2>

        <p id="result-text"></p>

        <button id="restart-button">
            もう一度遊ぶ
        </button>

    </section>

</main>


<script>

// ==============================
// Backrooms Level 推理ゲーム
// ==============================


// Levelデータ

const levels = [
    { id: 0, name: "Level 0" },
    { id: 1, name: "Level 1「居住可能区域」" },
    { id: 2, name: "Level 2「パイプドリーム」" },
    { id: 3, name: "Level 3" },
    { id: 4, name: "Level 4「放棄されたオフィス」" },
    { id: 5, name: "Level 5「Terror Hotel」" },
    { id: 6, name: "Level 6「消灯」" },
    { id: 7, name: "Level 7「Thalassophobia」" },
    { id: 8, name: "Level 8「洞窟網」" },
    { id: 9, name: "Level 9「郊外」" },
    { id: 10, name: "Level 10「小麦畑」" },
    { id: 11, name: "Level 11「The City That Never Sleeps」" }
];


// ==============================
// 通常質問
// ==============================

const normalQuestions = [

    {
        id: "permanent-living",
        text: "人間が長期間定住できる環境ですか？",
        yes: [1, 4, 11]
    },

    {
        id: "sky",
        text: "その空間には空が見えますか？",
        yes: [7, 9, 10, 11]
    },

    {
        id: "buildings",
        text: "そこには建物がありますか？",
        yes: [7, 9, 10, 11]
    },

    {
        id: "environment-danger",
        text: "エンティティ以外の環境そのものによる危険が大きいですか？",
        yes: [0, 2, 3, 6, 7]
    },

    {
        id: "entity-danger",
        text: "そのレベルの主な危険は、エンティティによるものですか？",
        yes: [5, 8, 9]
    },

    {
        id: "non-sun-light",
        text: "そのレベルに、太陽以外の光源はありますか？",
        yes: [0, 1, 2, 3, 4, 5, 9, 11]
    },

    {
        id: "stairs",
        text: "そのレベルには階段がありますか？",
        yes: [4, 5, 6, 9, 11]
    },

    {
        id: "windows",
        text: "そのレベルには窓がありますか？",
        yes: [4, 5, 7, 9, 11]
    },

    {
        id: "telephone",
        text: "そのレベルには電話がありますか？",
        yes: [4, 5, 9, 11]
    }
];


// ==============================
// Level専用質問
// 3問目以降から出現
// ==============================

const specialQuestions = [

    {
        id: "level0-movie",
        text: "2026年のBackrooms映画に登場した空間のモデルになりましたか？",
        yes: [0]
    },

    {
        id: "level1-parking",
        text: "主な空間は駐車場のような構造ですか？",
        yes: [1]
    },

    {
        id: "level2-narrow",
        text: "狭い通路が主な環境ですか？",
        yes: [2]
    },

    {
        id: "level3-electric",
        text: "感電が主な危険の一つですか？",
        yes: [3]
    },

    {
        id: "level4-water-server",
        text: "アーモンドウォーターが入ったウォーターサーバーが確認されていますか？",
        yes: [4]
    },

    {
        id: "level5-boiler",
        text: "ボイラー室がありますか？",
        yes: [5]
    },

    {
        id: "level6-light",
        text: "その空間では、持ち込んだ光源も機能しなくなりますか？",
        yes: [6]
    },

    {
        id: "level7-water",
        text: "入口の床が浅い水で覆われていますか？",
        yes: [7]
    },

    {
        id: "level8-cave",
        text: "空間そのものが巨大な洞窟網ですか？",
        yes: [8]
    },

    {
        id: "level9-midnight",
        text: "空を観測した結果、常に真夜中であることが確認されていますか？",
        yes: [9]
    },

    {
        id: "level10-fog",
        text: "そこでは常に濃い霧が発生していますか？",
        yes: [10]
    },

    {
        id: "level11-effect",
        text: "このレベルの名前が付いた固有の現象が確認されていますか？",
        yes: [11]
    }
];


// ==============================
// ゲームの状態
// ==============================

let targetLevel;

let questionCount = 0;

let usedQuestionIds = [];

let currentQuestions = [];

let remainingLevels = levels.map(level => level.id);

let history = [];


// ==============================
// HTML要素
// ==============================

const questionCountElement =
    document.getElementById("question-count");

const remainingCountElement =
    document.getElementById("remaining-count");

const questionButtonsElement =
    document.getElementById("question-buttons");

const historyElement =
    document.getElementById("history");

const guessButton =
    document.getElementById("guess-button");

const guessPanel =
    document.getElementById("guess-panel");

const levelButtonsElement =
    document.getElementById("level-buttons");

const cancelButton =
    document.getElementById("cancel-button");

const resultElement =
    document.getElementById("result");

const resultTitle =
    document.getElementById("result-title");

const resultText =
    document.getElementById("result-text");

const restartButton =
    document.getElementById("restart-button");


// ==============================
// 配列をランダムに並べ替える
// ==============================

function shuffle(array) {

    const copied = [...array];

    for (let i = copied.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [copied[i], copied[j]] =
            [copied[j], copied[i]];
    }

    return copied;
}


// ==============================
// 現在使用可能な質問を取得
// ==============================

function getAvailableQuestions() {

    // 最初の2問は通常質問のみ
    if (questionCount < 2) {
        return normalQuestions;
    }

    // 3問目以降は専用質問も使用可能
    return [
        ...normalQuestions,
        ...specialQuestions
    ];
}


// ==============================
// 新しい質問を1つ補充
// ==============================

function addNewQuestion() {

    const availableQuestions =
        getAvailableQuestions().filter(question => {

            const notUsed =
                !usedQuestionIds.includes(question.id);

            const notDisplayed =
                !currentQuestions.some(
                    current => current.id === question.id
                );

            return notUsed && notDisplayed;
        });


    if (availableQuestions.length === 0) {
        return;
    }


    const randomQuestion =
        shuffle(availableQuestions)[0];

    currentQuestions.push(randomQuestion);
}


// ==============================
// 最初の4問を作る
// ==============================

function createFirstQuestions() {

    const shuffled =
        shuffle(normalQuestions);

    currentQuestions =
        shuffled.slice(0, 4);
}


// ==============================
// 質問ボタン表示
// ==============================

function renderQuestions() {

    questionButtonsElement.innerHTML = "";

    currentQuestions.forEach(question => {

        const button =
            document.createElement("button");

        button.className =
            "question-button";

        button.textContent =
            question.text;


        button.addEventListener(
            "click",
            () => askQuestion(question)
        );


        questionButtonsElement.appendChild(button);
    });
}


// ==============================
// 質問する
// ==============================

function askQuestion(question) {

    const answer =
        question.yes.includes(targetLevel);


    questionCount++;

    usedQuestionIds.push(question.id);


    history.push({
        text: question.text,
        answer: answer
    });


    // 回答に合わない候補を除外
    remainingLevels =
        remainingLevels.filter(levelId => {

            const levelAnswer =
                question.yes.includes(levelId);

            return levelAnswer === answer;
        });


    // 選んだ質問を削除
    currentQuestions =
        currentQuestions.filter(
            current => current.id !== question.id
        );


    // 新しい質問を1つ補充
    addNewQuestion();


    updateGameDisplay();
}


// ==============================
// 画面更新
// ==============================

function updateGameDisplay() {

    questionCountElement.textContent =
        questionCount;

    remainingCountElement.textContent =
        remainingLevels.length;


    renderQuestions();

    renderHistory();
}


// ==============================
// 履歴表示
// ==============================

function renderHistory() {

    historyElement.innerHTML = "";


    if (history.length === 0) {

        historyElement.innerHTML = `
            <p class="empty-history">
                まだ質問していません。
            </p>
        `;

        return;
    }


    history.forEach((item, index) => {

        const historyItem =
            document.createElement("div");

        historyItem.className =
            "history-item";


        const answerText =
            item.answer ? "はい" : "いいえ";


        historyItem.innerHTML = `
            <strong>質問 ${index + 1}</strong>
            ：${item.text}
            <br>
            回答：
            <span class="${
                item.answer
                    ? "answer-yes"
                    : "answer-no"
            }">
                ${answerText}
            </span>
        `;


        historyElement.appendChild(historyItem);
    });
}


// ==============================
// 回答画面を開く
// ==============================

guessButton.addEventListener(
    "click",
    () => {

        guessPanel.classList.remove("hidden");

        renderLevelButtons();
    }
);


cancelButton.addEventListener(
    "click",
    () => {

        guessPanel.classList.add("hidden");
    }
);


function renderLevelButtons() {

    levelButtonsElement.innerHTML = "";


    levels.forEach(level => {

        const button =
            document.createElement("button");

        button.className =
            "level-button";

        button.textContent =
            level.name;


        button.addEventListener(
            "click",
            () => makeGuess(level.id)
        );


        levelButtonsElement.appendChild(button);
    });
}


// ==============================
// 回答判定
// ==============================

function makeGuess(guessedLevel) {

    guessPanel.classList.add("hidden");

    resultElement.classList.remove("hidden");


    const correctLevel =
        levels.find(
            level =>
                level.id === targetLevel
        );


    if (guessedLevel === targetLevel) {

        resultTitle.textContent =
            "正解！";

        resultText.textContent =
            `${correctLevel.name} を ${questionCount} 問で当てました！`;

    } else {

        resultTitle.textContent =
            "不正解";

        resultText.textContent =
            `正解は ${correctLevel.name} でした。`;
    }


    // ゲーム終了
    questionButtonsElement.innerHTML = "";

    guessButton.style.display = "none";
}


// ==============================
// リスタート
// ==============================

restartButton.addEventListener(
    "click",
    () => {

        startGame();
    }
);


// ==============================
// ゲーム開始
// ==============================

function startGame() {

    // 正解Levelをランダムに選ぶ
    targetLevel =
        Math.floor(Math.random() * 12);


    questionCount = 0;

    usedQuestionIds = [];

    remainingLevels =
        levels.map(level => level.id);

    history = [];


    // 最初の4問を作成
    createFirstQuestions();


    resultElement.classList.add("hidden");

    guessButton.style.display = "block";

    guessPanel.classList.add("hidden");


    updateGameDisplay();


    // 開発中の確認用
    console.log(
        "今回の正解:",
        targetLevel
    );
}


// 最初にゲーム開始

startGame();

</script>

</body>
</html>
